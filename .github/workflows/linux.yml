name: linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev \
            adwaita-icon-theme librsvg2-common

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            linux/target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('linux/Cargo.lock', 'linux/Cargo.toml') }}

      - name: Test
        working-directory: linux
        run: cargo test -p shh-core

      - name: Build .deb
        working-directory: linux
        run: ./build-deb.sh

      # The self-contained package for systems older than 24.04.
      - name: Build self-contained .deb
        working-directory: linux
        run: ./build-bundle.sh

      # It has to install and start on a real Ubuntu 22.04 userland.
      - name: Smoke test on Ubuntu 22.04
        run: |
          docker run --rm -v "$PWD/linux/dist":/dist ubuntu:22.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /dist/shh-bundled_*.deb xvfb xauth dbus-x11 >/dev/null
            export XDG_CONFIG_HOME=/tmp/cfg GTK_A11Y=none
            set +e
            dbus-run-session -- xvfb-run -a timeout 10 shh > /tmp/shh.log 2>&1
            code=$?
            cat /tmp/shh.log
            # still running when the timeout fired = it started and stayed up
            [ "$code" -eq 124 ] || { echo "shh exited with $code"; exit 1; }
            [ -f /tmp/cfg/sshm/sshm.json ] || { echo "config was not written"; exit 1; }
            echo "shh runs on $(. /etc/os-release; echo $PRETTY_NAME)"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: shh-${{ matrix.arch }}-deb
          path: linux/dist/*.deb
          if-no-files-found: error

      # Attach to the release the Mac release script already made: the pushed
      # tag's, or on a manual run the latest one. Never creates a release, so
      # the Mac installer's "latest release has a .zip" assumption holds.
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          TAG="$REF_TAG"
          [ -n "$TAG" ] || TAG=$(gh release view --json tagName -q .tagName)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" linux/dist/*.deb --clobber
          else
            echo "::warning::no release for $TAG; .deb kept as a workflow artifact only"
          fi
