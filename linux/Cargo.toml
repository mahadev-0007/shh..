[workspace]
resolver = "2"
members = ["crates/shh-core", "crates/shh-remote", "crates/shh-sharing", "crates/shh-icons", "crates/shh"]

[workspace.package]
version = "1.3.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
vte = { package = "vte4", version = "0.8", features = ["v0_76"] }
shh-core = { path = "crates/shh-core" }
shh-remote = { path = "crates/shh-remote" }
shh-sharing = { path = "crates/shh-sharing" }
shh-icons = { path = "crates/shh-icons" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
